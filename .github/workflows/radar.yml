name: Global Trend Radar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/radar.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a safe connection test to configured notification channels'
        type: boolean
        default: false
      force_refresh:
        description: 'Ignore source intervals for this manual run'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: radar-production
  cancel-in-progress: false
jobs:
  radar:
    if: github.event_name == 'workflow_dispatch' || vars.RADAR_SCHEDULE_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Collect sources
        env:
          FORCE_REFRESH: ${{ inputs.force_refresh }}
        run: |
          if [ "$FORCE_REFRESH" = true ]; then
            python radar.py collect --require-db --force
          else
            python radar.py collect --require-db
          fi
      - run: python radar.py alerts --send --require-db
      - name: Manual notification test
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_notification)
        run: python send_digest.py --test
      - name: Daily Turkish report (catch up after 07:30 Istanbul)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" -ge 05 ]; then python send_digest.py; fi
      - name: Scheduled weekly and monthly reports (UTC)
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" = 05 ]; then
            if [ "$(date -u +%u)" = 1 ]; then python radar.py report --days 7 --send --require-db >/dev/null; fi
            if [ "$(date -u +%d)" = 01 ]; then python radar.py report --days 30 --send --require-db >/dev/null; fi
          fi
      - if: always()
        run: python radar.py health --require-db
